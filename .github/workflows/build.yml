# Windows上で単体テスト → EXE・ZIPのビルド → 配布版の自己診断 を行う。
# タグ (v1.2.3) をプッシュすると GitHub Releases に配布物を添付する (アプリの自動更新はこれを参照できる)。
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements-dev.txt

      - name: Lint
        run: .venv\Scripts\python -m pyflakes msm main.py

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python -m pytest -q tests/test_unit.py tests/test_automation_unit.py tests/test_more_unit.py tests/test_upnp_unit.py tests/test_snapshot_unit.py tests/test_ui_unit.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build
        shell: pwsh
        env:
          MSM_RELEASE_BASE_URL: ${{ startsWith(github.ref, 'refs/tags/') && format('https://github.com/{0}/releases/download/{1}/', github.repository, github.ref_name) || '' }}
        run: .\build\build.ps1 -SkipTests

      - name: Self-test packaged EXE (clean data folder)
        shell: pwsh
        run: |
          $env:MSM_DATA_DIR = "$env:RUNNER_TEMP\msm-selftest"
          $p = Start-Process dist\MinecraftServerManager-portable.exe -ArgumentList '--selftest', "$env:RUNNER_TEMP\selftest.json" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\selftest.json"
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftServerManager
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
            dist/latest.json

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MinecraftServerManager-v*.zip
            dist/MinecraftServerManager-Setup-v*.exe
            dist/*.sha256
            dist/latest.json
